name: Trigger Brand Assets

on:
  schedule:
    - cron: "0 0 * * 1"  # Weekly at midnight UTC (6 pm CST)
  workflow_dispatch:

jobs:
  trigger-brand-assets:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Trigger FastAPI brand assets endpoint
        env:
          API_URL: ${{ secrets.API_BASE_URL }}
        run: |
          echo "Triggering brand assets endpoint..."
          status_code=$(curl -s -o response.json -w "%{http_code}" -X POST "$API_URL/trigger/send-brand-assets")
          echo "Status code: $status_code"
          cat response.json