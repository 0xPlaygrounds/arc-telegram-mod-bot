name: Trigger Scheduled Warning (8 AM)

on:
  schedule:
    - cron: "0 8 * * 1"  # Weekly at 8:00 AM UTC (2 am CST)
  workflow_dispatch:

jobs:
  trigger-warning:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Trigger FastAPI scheduled warning endpoint (index 0)
        env:
          API_URL: ${{ secrets.API_BASE_URL }}
        run: |
          echo "Triggering scheduled warning (8 AM - index 0)..."
          status_code=$(curl -s -o response.json -w "%{http_code}" -X POST "$API_URL/trigger/send-scheduled-warning?index=0")
          echo "Status code: $status_code"
          cat response.json