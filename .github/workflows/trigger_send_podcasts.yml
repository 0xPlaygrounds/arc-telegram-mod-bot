name: Trigger Podcasts Message
on:
  schedule:
    - cron: "0 6 * * 0"  # once per week: Sunday at 06:00 UTC
  workflow_dispatch:

jobs:
  trigger-podcasts:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Trigger FastAPI podcasts endpoint
        env:
          API_URL: ${{ secrets.PODCASTS_API_URL }}
        run: |
          echo "Triggering podcasts endpoint..."
          status_code=$(curl -s -o response.json -w "%{http_code}" -X POST "$API_URL")
          echo "Status code: $status_code"
          cat response.json
